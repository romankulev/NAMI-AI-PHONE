<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Голосовой помощник NAMI</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #07101d;
      --card: rgba(17, 29, 48, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: #f6f8fb;
      --muted: #91a2b8;
      --blue: #4b8dff;
      --cyan: #48d9f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--tg-theme-text-color, var(--text));
      background:
        radial-gradient(circle at 50% 12%, rgba(47, 110, 255, 0.26), transparent 34rem),
        linear-gradient(160deg, var(--tg-theme-bg-color, var(--bg)), #040914 75%);
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 430px);
      padding: 30px 24px 24px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(22px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 8vw, 38px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .orb-wrap { height: 190px; display: grid; place-items: center; }

    .orb {
      width: 116px;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 32% 28%, #d6f9ff 0 4%, #67ddff 17%, #397cff 48%, #6138d8 100%);
      box-shadow:
        0 0 0 15px rgba(74, 137, 255, 0.07),
        0 0 65px rgba(68, 137, 255, 0.55),
        inset -18px -16px 34px rgba(30, 0, 105, 0.38);
      transition: transform 220ms ease, filter 220ms ease;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: -21px;
      border: 1px solid rgba(117, 205, 255, 0.28);
      border-radius: inherit;
      opacity: 0;
    }

    .orb.connecting { animation: breathe 1.1s ease-in-out infinite; }
    .orb.listening { animation: listen 1.35s ease-in-out infinite; }
    .orb.speaking { animation: speak 0.62s ease-in-out infinite alternate; }
    .orb.listening::after, .orb.speaking::after { animation: ring 1.6s ease-out infinite; }

    @keyframes breathe { 50% { transform: scale(0.92); filter: saturate(1.3); } }
    @keyframes listen { 50% { transform: scale(1.08); } }
    @keyframes speak { to { transform: scale(1.13) rotate(3deg); filter: hue-rotate(16deg); } }
    @keyframes ring { from { transform: scale(0.86); opacity: 0.8; } to { transform: scale(1.45); opacity: 0; } }

    .status {
      min-height: 48px;
      margin: 0 0 18px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .status strong { color: var(--text); }
    .actions { display: grid; gap: 10px; }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      color: white;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.98); }
    button:disabled { cursor: wait; opacity: 0.58; }
    button[hidden] { display: none; }
    #start { background: linear-gradient(135deg, var(--blue), #715cff); box-shadow: 0 12px 34px rgba(59, 112, 255, 0.35); }
    #mute { background: rgba(75, 141, 255, 0.14); color: #b9d4ff; border: 1px solid rgba(75, 141, 255, 0.3); }
    #mute[aria-pressed="true"] { background: rgba(255, 185, 71, 0.14); color: #ffd18a; border-color: rgba(255, 185, 71, 0.32); }
    #stop { background: rgba(255, 93, 117, 0.13); color: #ff9bac; border: 1px solid rgba(255, 93, 117, 0.25); }
    #chat-toggle { background: rgba(75, 141, 255, 0.14); color: #b9d4ff; border: 1px solid rgba(75, 141, 255, 0.3); }

    .chat {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: left;
    }

    .chat[hidden] { display: none; }

    .chat-log {
      min-height: 110px;
      max-height: 280px;
      overflow-y: auto;
      padding: 2px 2px 8px;
      display: grid;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .chat-message {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 15px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.42;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chat-message.assistant { justify-self: start; background: rgba(255, 255, 255, 0.08); border-bottom-left-radius: 4px; }
    .chat-message.user { justify-self: end; background: rgba(75, 141, 255, 0.72); border-bottom-right-radius: 4px; }

    .chat-compose { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }

    #chat-input {
      min-width: 0;
      min-height: 48px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.16);
      font: inherit;
      line-height: 1.3;
    }

    #chat-send { width: auto; min-height: 48px; padding: 0 14px; background: linear-gradient(135deg, var(--blue), #715cff); }
    #chat-stop { margin-top: 9px; min-height: 42px; background: rgba(255, 93, 117, 0.13); color: #ff9bac; border: 1px solid rgba(255, 93, 117, 0.25); }

    .hint { margin: 17px 0 0; color: #63758c; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ElevenLabs Agent</p>
    <h1>Администратор NAMI</h1>
    <p class="subtitle">Живой разговор с администратором прямо в Telegram или браузере.</p>

    <div class="orb-wrap" aria-hidden="true">
      <div id="orb" class="orb"></div>
    </div>

    <p id="status" class="status"><strong>Готов к разговору</strong></p>

    <div class="actions">
      <button id="start" type="button">🎙 Начать разговор</button>
      <button id="chat-toggle" type="button">💬 Написать ассистенту</button>
      <button id="mute" type="button" aria-pressed="false" hidden>🔇 Выключить микрофон</button>
      <button id="stop" type="button" hidden>Завершить разговор</button>
    </div>

    <section id="chat" class="chat" aria-label="Текстовый чат с администратором" hidden>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-compose">
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Напишите сообщение…" disabled></textarea>
        <button id="chat-send" type="submit" disabled>Отправить</button>
      </form>
      <button id="chat-stop" type="button">Закрыть чат</button>
    </section>

    <p class="hint">Включены WebRTC-эхоподавление, шумоподавление и возможность перебивать ассистента.</p>
  </main>

  <script type="module">
    import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.21.0/+esm";

    const tg = window.Telegram?.WebApp;
    const startButton = document.querySelector("#start");
    const chatToggleButton = document.querySelector("#chat-toggle");
    const muteButton = document.querySelector("#mute");
    const stopButton = document.querySelector("#stop");
    const chatPanel = document.querySelector("#chat");
    const chatLog = document.querySelector("#chat-log");
    const chatForm = document.querySelector("#chat-form");
    const chatInput = document.querySelector("#chat-input");
    const chatSendButton = document.querySelector("#chat-send");
    const chatStopButton = document.querySelector("#chat-stop");
    const statusElement = document.querySelector("#status");
    const orb = document.querySelector("#orb");

    let conversation = null;
    let conversationMode = null;
    let microphoneMuted = false;
    let stopping = false;
    let activeChatMessage = null;
    const backchannelUrls = [
      "/api/backchannels/agree",
      "/api/backchannels/understand",
      "/api/backchannels/thinking",
      "/api/backchannels/continue",
    ];
    let agentSpeaking = false;
    let userSpeechStartedAt = 0;
    let lastUserSpeechAt = 0;
    let lastBackchannelAt = 0;
    let backchannelTimer = null;
    let playingBackchannel = null;

    tg?.ready();
    tg?.expand();
    tg?.disableVerticalSwipes?.();
    tg?.setHeaderColor?.("#08111f");
    tg?.setBackgroundColor?.("#07101d");

    function setState(state, message) {
      orb.className = `orb ${state || ""}`.trim();
      statusElement.innerHTML = message;
    }

    function errorMessage(error) {
      if (typeof error === "string") return error;
      return error?.message || "Не удалось начать разговор";
    }

    function participantName() {
      const telegramId = tg?.initDataUnsafe?.user?.id;
      return telegramId ? `telegram-${telegramId}` : undefined;
    }

    async function fetchConversationToken() {
      const response = await fetch("/api/elevenlabs/conversation-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ participant_name: participantName() }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.detail || `Ошибка сервера: ${response.status}`);
      }
      return body.token;
    }

    async function fetchSignedUrl() {
      const response = await fetch("/api/elevenlabs/signed-url", { method: "POST" });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.detail || `Ошибка сервера: ${response.status}`);
      }
      return body.signed_url;
    }

    function setVoiceConnectedUI() {
      startButton.hidden = true;
      chatToggleButton.hidden = true;
      startButton.disabled = false;
      muteButton.hidden = false;
      stopButton.hidden = false;
      setState("listening", "<strong>Слушаю вас</strong>");
      // Fetch the four fixed clips while the conversation connects. They are
      // played locally later, so no LLM turn is created for an "ага".
      backchannelUrls.forEach((url) => fetch(url, { cache: "force-cache" }).catch(() => {}));
    }

    function stopBackchanneling() {
      if (backchannelTimer) clearTimeout(backchannelTimer);
      backchannelTimer = null;
      userSpeechStartedAt = 0;
      lastUserSpeechAt = 0;
      if (playingBackchannel) {
        playingBackchannel.pause();
        playingBackchannel = null;
      }
    }

    function playBackchannel() {
      if (agentSpeaking || microphoneMuted || playingBackchannel || !conversation) return;
      const audio = new Audio(backchannelUrls[Math.floor(Math.random() * backchannelUrls.length)]);
      audio.preload = "auto";
      audio.volume = 0.42;
      audio.onended = () => { if (playingBackchannel === audio) playingBackchannel = null; };
      audio.onerror = () => { if (playingBackchannel === audio) playingBackchannel = null; };
      playingBackchannel = audio;
      audio.play().catch(() => { if (playingBackchannel === audio) playingBackchannel = null; });
    }

    function noteUserSpeech() {
      if (conversationMode !== "voice" || agentSpeaking || microphoneMuted) return;
      const now = Date.now();
      if (!userSpeechStartedAt || now - lastUserSpeechAt > 900) userSpeechStartedAt = now;
      lastUserSpeechAt = now;
      if (now - userSpeechStartedAt < 2400 || now - lastBackchannelAt < 7000 || backchannelTimer) return;
      backchannelTimer = setTimeout(() => {
        backchannelTimer = null;
        const current = Date.now();
        if (!agentSpeaking && current - lastUserSpeechAt < 900 && current - lastBackchannelAt >= 7000) {
          lastBackchannelAt = current;
          playBackchannel();
        }
      }, 180);
    }

    function handleConversationMessage(message = {}) {
      // ElevenLabs sends tentative and final user_transcript events when this
      // client event is enabled. Be tolerant of SDK event-shape changes.
      const type = message.type || message?.user_transcription_event?.type;
      if (type === "user_transcript" || message.source === "user" || message.user_transcription_event) {
        noteUserSpeech();
      }
    }

    function resetUI(message = "Разговор завершён") {
      conversation = null;
      conversationMode = null;
      activeChatMessage = null;
      agentSpeaking = false;
      stopBackchanneling();
      microphoneMuted = false;
      muteButton.setAttribute("aria-pressed", "false");
      muteButton.textContent = "🔇 Выключить микрофон";
      startButton.hidden = false;
      startButton.disabled = false;
      chatToggleButton.hidden = false;
      chatToggleButton.disabled = false;
      muteButton.hidden = true;
      stopButton.hidden = true;
      chatPanel.hidden = true;
      chatInput.disabled = true;
      chatSendButton.disabled = true;
      setState("", message);
    }

    async function startConversation() {
      startButton.disabled = true;
      setState("connecting", "Создаю защищённое соединение…");

      try {
        const conversationToken = await fetchConversationToken();
        conversationMode = "voice";
        conversation = await Conversation.startSession({
          conversationToken,
          connectionType: "webrtc",
          preferHeadphonesForIosDevices: true,
          onConnect: () => setVoiceConnectedUI(),
          onDisconnect: () => {
            if (!stopping) resetUI("Соединение завершено");
          },
          onStatusChange: ({ status } = {}) => {
            if (status === "connecting") {
              setState("connecting", "Подключаю голосового администратора…");
            }
          },
          onMessage: handleConversationMessage,
          onModeChange: ({ mode } = {}) => {
            if (microphoneMuted) {
              setState("", "<strong>Микрофон выключен</strong>");
            } else if (mode === "speaking") {
              agentSpeaking = true;
              stopBackchanneling();
              setState("speaking", "Администратор отвечает…");
            } else {
              agentSpeaking = false;
              setState("listening", "<strong>Слушаю вас</strong>");
            }
          },
          onError: (error) => {
            console.error("ElevenLabs conversation error", error);
            setState("", errorMessage(error));
          },
        });
      } catch (error) {
        console.error(error);
        resetUI(errorMessage(error));
      }
    }

    function scrollChatToBottom() {
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function appendChatMessage(role, text = "") {
      const message = document.createElement("div");
      message.className = `chat-message ${role}`;
      message.textContent = text;
      chatLog.append(message);
      scrollChatToBottom();
      return message;
    }

    function setChatConnectedUI() {
      startButton.hidden = true;
      chatToggleButton.hidden = true;
      chatToggleButton.disabled = false;
      chatPanel.hidden = false;
      chatInput.disabled = false;
      chatSendButton.disabled = false;
      setState("listening", "<strong>Чат подключён</strong>");
      chatInput.focus();
    }

    function handleAgentChatResponsePart(event = {}) {
      const part = event.text_response_part || event;
      const type = part?.type;
      if (type === "start") {
        activeChatMessage = appendChatMessage("assistant");
        setState("speaking", "Администратор печатает…");
        return;
      }
      if (type === "delta") {
        if (!activeChatMessage) activeChatMessage = appendChatMessage("assistant");
        activeChatMessage.textContent += part.text || "";
        scrollChatToBottom();
        return;
      }
      if (type === "stop") {
        activeChatMessage = null;
        chatInput.disabled = false;
        chatSendButton.disabled = false;
        setState("listening", "<strong>Чат подключён</strong>");
        chatInput.focus();
      }
    }

    async function startTextChat() {
      chatToggleButton.disabled = true;
      chatPanel.hidden = false;
      chatLog.replaceChildren();
      chatInput.disabled = true;
      chatSendButton.disabled = true;
      setState("connecting", "Подключаю текстовый чат…");

      try {
        const signedUrl = await fetchSignedUrl();
        conversationMode = "chat";
        conversation = await Conversation.startSession({
          signedUrl,
          connectionType: "websocket",
          overrides: { conversation: { textOnly: true } },
          onConnect: () => setChatConnectedUI(),
          onDisconnect: () => {
            if (!stopping) resetUI("Чат завершён");
          },
          onAgentChatResponsePart: handleAgentChatResponsePart,
          onError: (error) => {
            console.error("ElevenLabs chat error", error);
            setState("", errorMessage(error));
          },
        });
      } catch (error) {
        console.error(error);
        resetUI(errorMessage(error));
      }
    }

    async function sendChatMessage(event) {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !conversation || conversationMode !== "chat") return;

      appendChatMessage("user", text);
      chatInput.value = "";
      chatInput.disabled = true;
      chatSendButton.disabled = true;
      setState("speaking", "Администратор печатает…");
      try {
        await conversation.sendUserMessage(text);
      } catch (error) {
        console.error("ElevenLabs sendUserMessage", error);
        chatInput.disabled = false;
        chatSendButton.disabled = false;
        setState("", errorMessage(error));
      }
    }

    function toggleMicrophone() {
      if (!conversation) return;
      microphoneMuted = !microphoneMuted;
      conversation.setMicMuted(microphoneMuted);
      muteButton.setAttribute("aria-pressed", String(microphoneMuted));
      muteButton.textContent = microphoneMuted
        ? "🎙 Включить микрофон"
        : "🔇 Выключить микрофон";
      setState(
        microphoneMuted ? "" : "listening",
        microphoneMuted ? "<strong>Микрофон выключен</strong>" : "<strong>Слушаю вас</strong>",
      );
    }

    async function stopConversation(message = "Разговор завершён") {
      if (!conversation) {
        resetUI(message);
        return;
      }
      stopping = true;
      const activeConversation = conversation;
      conversation = null;
      try {
        await activeConversation.endSession();
      } catch (error) {
        console.warn("ElevenLabs endSession", error);
      } finally {
        stopping = false;
        resetUI(message);
      }
    }

    startButton.addEventListener("click", startConversation);
    chatToggleButton.addEventListener("click", startTextChat);
    muteButton.addEventListener("click", toggleMicrophone);
    stopButton.addEventListener("click", () => stopConversation());
    chatForm.addEventListener("submit", sendChatMessage);
    chatStopButton.addEventListener("click", () => stopConversation("Чат завершён"));
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });
    window.addEventListener("pagehide", () => {
      if (conversation) void conversation.endSession();
    });
  </script>
</body>
</html>
